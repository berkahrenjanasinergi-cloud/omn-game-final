<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMN Quest - Latihan Final OMN Mentari</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--a:#7c5cff;--b:#00e0ff;--c:#ff5ca8;--ok:#2ee59d;--bad:#ff5c6c;--g:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(1100px 700px at 15% -10%,#3b2a8f,transparent),radial-gradient(900px 600px at 100% 100%,#0a5a7a,transparent),#0b0a1f}
canvas{position:fixed;inset:0;pointer-events:none}#stars{z-index:-1}#cf{z-index:9}
.wrap{max-width:920px;margin:auto;padding:16px}
.card{background:var(--g);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:22px;padding:18px;box-shadow:0 10px 40px #0006;margin-bottom:14px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(30px,7vw,54px);font-weight:800;background:linear-gradient(90deg,var(--b),var(--c));-webkit-background-clip:text;color:transparent}
.hero{text-align:center;padding:14px 0 20px}.hero p{opacity:.8;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{cursor:pointer;text-align:center;transition:.25s;margin:0}
.mode:hover{transform:translateY(-6px) scale(1.03);border-color:var(--b);box-shadow:0 0 34px #00e0ff44}
.mode .ic{font-size:56px;animation:fl 3s ease-in-out infinite}.mode p{opacity:.75;font-size:14px}
@keyframes fl{50%{transform:translateY(-8px) rotate(4deg)}}
.btn{border:0;border-radius:14px;padding:11px 20px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 6px 20px #7c5cff66;transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.g{background:var(--g);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{background:var(--g);border-radius:99px;padding:4px 14px;font-weight:700;font-size:15px}
.chip a{color:var(--b);cursor:pointer;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.top .chips{justify-content:flex-end}
input{font:inherit;font-size:24px;font-weight:700;color:#fff;background:#0005;border:2px solid #fff3;border-radius:14px;padding:10px 14px;width:100%;text-align:center;outline:0}
input:focus{border-color:var(--b);box-shadow:0 0 20px #00e0ff55}
.row{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}.row input{flex:1;min-width:160px}
.bar{height:14px;border-radius:9px;background:#0006;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s;background:linear-gradient(90deg,var(--ok),var(--b))}
.tm{width:100%;transition:none!important}
.q{font-size:clamp(20px,4.4vw,28px);font-weight:700;line-height:1.35;margin:12px 0;min-height:80px}
.lv{font-size:14px;opacity:.9}.lDasar{color:var(--ok)}.lMenengah{color:#ffc233}.lHOTS{color:var(--c)}
.fb{margin-top:12px;padding:12px;border-radius:14px;font-weight:700;animation:in .3s}.fb.ok{background:#2ee59d33}.fb.bad{background:#ff5c6c33}
.ex{margin:8px 0 12px;opacity:.85;font-size:15px}
.bossbox{text-align:center}.boss{font-size:90px;display:inline-block;animation:fl 2s ease-in-out infinite;filter:drop-shadow(0 0 24px var(--c))}
.hit{animation:hit .5s!important}@keyframes hit{25%{transform:translateX(-16px) rotate(-10deg);filter:brightness(3)}75%{transform:translateX(16px) rotate(10deg)}}
.center{text-align:center}.stars{font-size:46px}.big{font-size:64px;font-weight:800;color:var(--b)}
.rw{display:grid;grid-template-columns:150px 1fr 50px;gap:8px;align-items:center;text-align:left;font-size:14px}
.tp p{font-size:14px;opacity:.85;margin:6px 0}.tp .ti{font-size:18px}.tp small{opacity:.7;display:block}.tp .btn{margin-top:8px;padding:6px 14px}
.lb{display:grid;grid-template-columns:40px 1fr 80px 70px;padding:8px;border-bottom:1px solid #fff2;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{perspective:600px;height:92px;cursor:pointer}.mc .in{position:relative;height:100%;transition:.5s;transform-style:preserve-3d}.mc.on .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;padding:4px;text-align:center;font-weight:700}
.mc .f{background:linear-gradient(135deg,var(--a),var(--c));font-size:30px}.mc .b{background:#fff;color:#1a1640;transform:rotateY(180deg);font-size:15px}.mc.ok .b{background:var(--ok)}
@media(max-width:520px){.rw{grid-template-columns:100px 1fr 40px}.lb{grid-template-columns:34px 1fr 60px 56px}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.opt{text-align:left;font-size:18px;padding:14px}.opt b{background:#fff3;border-radius:8px;padding:2px 9px;margin-right:6px}.opt:disabled{cursor:default;transform:none;opacity:1}
.gv{position:relative;inset:auto;pointer-events:auto;width:100%;height:auto;border-radius:18px;display:block;touch-action:manipulation;box-shadow:0 8px 30px #0008}
.tk{display:grid;grid-template-columns:70px 1fr 50px;gap:6px;align-items:center;font-size:13px}.tr{position:relative;height:30px;border-bottom:3px dashed #fff4;margin-bottom:2px}.tr::after{content:'🏁';position:absolute;right:0;top:0;font-size:22px}.tr span{position:absolute;top:-2px;font-size:24px;transition:left .6s}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
</style></head><body><canvas id="stars"></canvas><canvas id="cf"></canvas><div class="wrap" id="app"></div>
<script>
/* ====== ISI DENGAN DATA SUPABASE KAMU (Project Settings > API) ====== */
const SB_URL='https://rpeexxpvlibmittdabkf.supabase.co',SB_KEY='sb_publishable_VJm_5kNvMDt9FG7JLJf1Wg_R-cl9fLv';
const sb=(SB_URL&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,rp=n=>'Rp'+n.toLocaleString('id-ID'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const D='Dasar',M='Menengah',H='HOTS',view=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
let me=localStorage.omn_name||'',S={},LAST,mute=false,ac;
/* ====== BUNYI, BINTANG, KONFETI ====== */
function beep(f,d=.12,t='sine'){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
(function(){const c=$('#stars'),x=c.getContext('2d');let P=[];function rs(){c.width=innerWidth;c.height=innerHeight;P=Array.from({length:110},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6+.3,p:Math.random()*6}))}rs();onresize=rs;(function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1200+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(f)})(0)})();
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height/2,vx:Math.random()*4-2,vy:Math.random()*4+2,s:Math.random()*8+4,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++n<220)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
/* ====== BANK SOAL (dibuat acak per subtopik kisi-kisi) ====== */
const T={
fpb:{n:'FPB',bab:'Bilangan',ic:'🧩',w:4,tip:'Faktorisasi prima tiap bilangan, ambil bilangan prima yang SAMA dengan pangkat TERKECIL, lalu kalikan.',g(){const g=pick([2,3,4,5,6,7,8,9,12]);let x=r(2,9),y=r(2,9);while(gcd(x,y)>1){x=r(2,9);y=r(2,9)}const a=g*x,b=g*y;return[`FPB dari ${a} dan ${b} adalah …`,g,D,`${a} = ${g}×${x} dan ${b} = ${g}×${y}, maka FPB = ${g}`]}},
kpk:{n:'KPK',bab:'Bilangan',ic:'🔁',w:3,tip:'Faktorisasi prima, ambil SEMUA bilangan prima dengan pangkat TERBESAR, lalu kalikan.',g(){let a=r(4,15),b=r(4,15);while(a==b)b=r(4,15);return[`KPK dari ${a} dan ${b} adalah …`,lcm(a,b),D,`KPK(${a},${b}) = ${lcm(a,b)}`]}},
cer:{n:'FPB/KPK Cerita',bab:'Bilangan',ic:'📖',w:3,tip:'"Dibagi rata sebanyak-banyaknya" → FPB. "Terjadi bersama lagi / berulang" → KPK.',g(){if(Math.random()<.5){const g=pick([3,4,5,6,8,12]),a=g*r(3,8),b=g*r(3,8);return[`Ani punya ${a} permen dan ${b} cokelat. Semuanya dibagi rata ke kantong sebanyak-banyaknya tanpa sisa. Berapa kantong?`,gcd(a,b),M,'Membagi rata → FPB']}const P=pick([[4,6],[6,8],[5,6],[6,9],[8,12],[10,15],[4,10]]);return[`Lampu merah menyala tiap ${P[0]} detik, lampu biru tiap ${P[1]} detik. Keduanya baru menyala bersama. Berapa detik lagi mereka menyala bersama?`,lcm(...P),M,'Kejadian berulang → KPK']}},
fak:{n:'Faktor & Prima',bab:'Bilangan',ic:'🔢',w:2,tip:'N = p^a × q^b → banyak faktor = (a+1)(b+1). Dua prima dari jumlah & selisih: besar = (jumlah+selisih)÷2.',g(){if(Math.random()<.6){const N=pick([12,18,20,24,28,30,36,40,42,48,60,72]);let c=0;for(let i=1;i<=N;i++)if(N%i==0)c++;return[`Banyak faktor dari ${N} adalah …`,c,M,`Faktorkan ${N} lalu pakai (a+1)(b+1) → ${c}`]}const P=pick([[13,7],[11,5],[17,3],[19,7],[23,5],[13,3],[17,13]]);return[`Dua bilangan prima berjumlah ${P[0]+P[1]} dan berselisih ${P[0]-P[1]}. Bilangan prima yang lebih besar adalah …`,P[0],M,`(${P[0]+P[1]} + ${P[0]-P[1]}) ÷ 2 = ${P[0]}`]}},
hot:{n:'FPB×KPK & Sisa',bab:'Bilangan',ic:'🧠',w:2,tip:'FPB × KPK = hasil kali kedua bilangan. Sisa sama s dibagi a dan b → KPK(a,b) + s.',g(){if(Math.random()<.5){const g=pick([2,3,4,5,6]),P=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[2,7],[3,7],[5,6]]),A=g*P[0],B=g*P[1],K=g*P[0]*P[1];return[`FPB dua bilangan = ${g} dan KPK-nya = ${K}. Jika salah satu bilangan ${A}, bilangan lainnya adalah …`,B,H,`FPB×KPK = ${g*K}, lalu ${g*K} ÷ ${A} = ${B}`]}const P=pick([[4,6],[6,8],[4,10],[6,9],[8,12],[5,6],[9,12],[10,15]]),s=pick([1,2,3]);return[`Bilangan terkecil yang jika dibagi ${P[0]} maupun ${P[1]} bersisa ${s} adalah …`,lcm(...P)+s,H,`KPK(${P}) + ${s} = ${lcm(...P)+s}`]}},
pec:{n:'Operasi Pecahan',bab:'Pecahan & Persen',ic:'🍕',w:5,tip:'Pecahan dari bilangan: bagi dengan penyebut, kali dengan pembilang. Penjumlahan: samakan penyebut dulu.',g(){const f=()=>{const b=pick([2,3,4,5,6,8]),a=r(1,b-1),x=b*r(2,12);return[`${a}/${b} dari ${x}`,a*x/b]};const[p,u]=f(),[q,v]=f();return[`${p} ditambah ${q} hasilnya …`,u+v,D,`${u} + ${v} = ${u+v}`]}},
des:{n:'Desimal',bab:'Pecahan & Persen',ic:'🔟',w:6,tip:'0,25 = 1/4 = 25%; 0,5 = 1/2; 0,75 = 3/4. Kalikan seperti bilangan bulat lalu geser koma.',g(){const L=[.25,.5,.75,1.5,2.5],a=pick(L),b=pick(L),x=4*r(2,15),y=4*r(2,15),f=n=>String(n).replace('.',',');return[`${f(a)} × ${x} + ${f(b)} × ${y} = …`,Math.round(a*x+b*y),D,`${a*x} + ${b*y}`]}},
per:{n:'Persen & Diskon',bab:'Pecahan & Persen',ic:'🏷️',w:8,tip:'Harga setelah diskon d% = harga × (100−d)%. Persen sisa = 100% − persen yang terpakai.',g(){if(Math.random()<.6){const P=1000*pick([40,60,80,120,150,200,250]),d=pick([10,20,25,30,40,50]),a=P*(100-d)/100;return[`Sepatu seharga ${rp(P)} didiskon ${d}%. Harga yang dibayar (Rp) …`,a,D,`${rp(P)} × ${100-d}% = ${rp(a)}`]}const N=20*r(2,20),p=pick([10,20,25,40,45]);return[`Dari ${N} buku, ${p}% sedang dipinjam. Berapa buku yang masih tersisa?`,N*(100-p)/100,D,`Sisa = ${100-p}% × ${N}`]}},
pb:{n:'Persen Bertingkat',bab:'Pecahan & Persen',ic:'📉',w:4,tip:'Diskon berturut-turut TIDAK dijumlah. Kalikan bertahap: harga × (100−a)% × (100−b)%.',g(){if(Math.random()<.65){const k=r(2,9),a=pick([10,20,25,50]),b=pick([10,20,25,50]),A=k*(100-a)*(100-b);return[`Barang Rp${k*10000} didiskon ${a}%, lalu didiskon lagi ${b}% dari harga setelah diskon pertama. Harga akhir (Rp) …`,A,H,`${k*10000} × ${100-a}% × ${100-b}% = ${A}`]}const p=pick([10,20,30,50]);return[`Sisi sebuah persegi diperpanjang ${p}%. Luasnya bertambah berapa persen?`,(100+p)**2/100-100,H,`Luas baru = ${100+p}% × ${100+p}% = ${(100+p)**2/100}%`]}},
cb:{n:'Soal Cerita Bertahap',bab:'Pecahan & Persen',ic:'🛒',w:9,tip:'Perhatikan BASIS hitungan: tahap kedua dihitung dari SISA, bukan dari jumlah awal.',g(){const N=36000*r(1,9),a=pick([[1,2],[1,3],[1,4],[2,5]]),b=pick([[1,2],[1,3]]),r1=N-N*a[0]/a[1];return[`Dina punya ${rp(N)}. Ia belanja ${a[0]}/${a[1]} dari uangnya, lalu ${b[0]}/${b[1]} dari SISANYA untuk jajan. Sisa uang Dina (Rp) …`,r1-r1*b[0]/b[1],M,`Sisa tahap 1 = ${rp(r1)}; tahap 2 dihitung dari ${rp(r1)}`]}},
lp:{n:'Luas Persegi/Panjang',bab:'Geometri',ic:'📐',w:5,tip:'Luas persegi panjang = p × l. Keliling = 2 × (p + l), jadi p + l = keliling ÷ 2.',g(){if(Math.random()<.6){const p=r(6,15),l=r(3,p-1);return[`Keliling persegi panjang ${2*(p+l)} cm dan panjangnya ${p} cm. Luasnya (cm²) …`,p*l,D,`l = ${p+l} − ${p} = ${l}; luas = ${p}×${l}`]}const s=r(3,14);return[`Keliling sebuah persegi ${4*s} cm. Luasnya (cm²) …`,s*s,D,`sisi = ${s}; luas = ${s}×${s}`]}},
gab:{n:'Bangun Gabungan',bab:'Geometri',ic:'🧱',w:3,tip:'Luas daerah arsiran = luas besar − luas bagian yang tidak diarsir.',g(){const a=r(10,25),b=r(8,20),s=r(2,6);return[`Taman berukuran ${a} m × ${b} m. Di tengahnya ada kolam persegi bersisi ${s} m. Luas taman yang bukan kolam (m²) …`,a*b-s*s,H,`${a}×${b} − ${s}×${s}`]}},
jam:{n:'Sudut Jarum Jam',bab:'Geometri',ic:'🕒',w:1,tip:'Jarum panjang: 6° per menit. Jarum pendek: 30° per jam + 0,5° per menit. Ambil selisih, jika >180° kurangkan dari 360°.',g(){const h=r(1,11),m=pick([0,20,40]);let s=Math.abs(30*h+.5*m-6*m);if(s>180)s=360-s;return[`Sudut terkecil antara jarum pendek dan panjang pada pukul ${h}.${m<10?'0'+m:m} adalah … derajat`,s,H,`Pendek ${30*h+.5*m}°, panjang ${6*m}°`]}},
vol:{n:'Volume & Satuan',bab:'Geometri',ic:'🧊',w:13,tip:'Volume balok = p×l×t; kubus = s³. 1 liter = 1.000 cm³ = 1 dm³; 1 m³ = 1.000 liter.',g(){const k=r(0,2);if(k==0){const p=r(3,12),l=r(3,12),t=r(2,10);return[`Volume balok berukuran ${p} cm × ${l} cm × ${t} cm (cm³) …`,p*l*t,D,`${p}×${l}×${t}`]}if(k==1){const s=r(3,12);return[`Volume kubus dengan rusuk ${s} cm (cm³) …`,s**3,D,`${s}×${s}×${s}`]}const p=10*r(2,8),l=10*r(2,8),t=10*r(2,8);return[`Bak berukuran ${p} cm × ${l} cm × ${t} cm terisi penuh air. Berapa liter air di dalamnya?`,p*l*t/1000,M,`${p*l*t} cm³ ÷ 1000 = ${p*l*t/1000} liter`]}},
vk:{n:'Air Naik (Benda Dicelup)',bab:'Geometri',ic:'🌊',w:1,tip:'Kenaikan air = volume benda ÷ luas alas bak.',g(){const L=100*r(2,8),t=r(2,9);return[`Bak beralas ${L} cm² berisi air. Sebuah batu bervolume ${L*t} cm³ dicelupkan seluruhnya. Air naik berapa cm?`,t,H,`${L*t} ÷ ${L} = ${t}`]}},
pol:{n:'Pola Bilangan',bab:'Pola',ic:'🌀',w:8,tip:'Beda tetap: Un = a + (n−1)b. Beda bertingkat: cek n², n(n+1). Rekursif: hitung suku demi suku.',g(){const k=r(0,2);if(k==0){const a=r(2,9),b=r(2,7),n=r(10,30);return[`Pola: ${a}, ${a+b}, ${a+2*b}, … Suku ke-${n} adalah …`,a+(n-1)*b,D,`${a} + (${n}−1)×${b}`]}if(k==1){const n=r(5,15);return Math.random()<.5?[`Pola: 2, 6, 12, 20, … Suku ke-${n} adalah …`,n*(n+1),M,'Un = n(n+1)']:[`Pola: 0, 3, 8, 15, … Suku ke-${n} adalah …`,n*n-1,M,'Un = n² − 1']}let u=r(1,3);const f=u,n=r(4,6);for(let i=1;i<n;i++)u=2*u+1;return[`Suku pertama = ${f}. Setiap suku berikutnya = 2 × suku sebelumnya + 1. Suku ke-${n} adalah …`,u,M,'Hitung berurutan satu per satu']}},
hr:{n:'Pola Hari',bab:'Pola',ic:'📅',w:3,tip:'Bagi jumlah hari dengan 7, pakai SISANYA untuk maju dari hari sekarang.',g(){const N=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],s=r(1,7),n=r(15,150);return[`Hari ini hari ${N[s-1]}. ${n} hari lagi adalah hari ke-… (1=Senin, 2=Selasa, … 7=Minggu)`,(s-1+n)%7+1,M,`${n} ÷ 7 bersisa ${n%7}`]}},
js:{n:'Jumlah-Selisih & Persamaan',bab:'Aljabar',ic:'⚖️',w:8,tip:'Bilangan besar = (jumlah + selisih) ÷ 2; bilangan kecil = (jumlah − selisih) ÷ 2.',g(){if(Math.random()<.5){const y=r(5,40),x=y+r(2,20);return[`Jumlah dua bilangan ${x+y} dan selisihnya ${x-y}. Bilangan terbesar adalah …`,x,D,`(${x+y} + ${x-y}) ÷ 2 = ${x}`]}const a=r(2,9),b=r(3,20),n=r(3,15);return[`Jika ${a}n + ${b} = ${a*n+b}, maka n = …`,n,D,`${a}n = ${a*n}, n = ${n}`]}},
alj:{n:'Kepala-Kaki & Umur',bab:'Aljabar',ic:'🐔',w:3,tip:'Pengandaian: anggap semua hewan berkaki 2, selisih kaki ÷ 2 = jumlah hewan berkaki 4.',g(){if(Math.random()<.5){const h=r(10,25),k=r(3,h-3);return[`Di kandang ada ayam dan kambing, seluruhnya ${h} ekor dan ${2*h+2*k} kaki. Banyak kambing …`,k,M,`Andai semua ayam: ${2*h} kaki; selisih ${2*k} ÷ 2 = ${k}`]}const m=pick([2,3,4,5]),u=r(5,15);return[`Umur ayah ${m} kali umur Dina. Selisih umur mereka ${(m-1)*u} tahun. Umur Dina (tahun) …`,u,M,`(${m}−1) bagian = ${(m-1)*u}, 1 bagian = ${u}`]}},
sk:{n:'Skor & Perbandingan',bab:'Aljabar',ic:'🎯',w:2,tip:'Skor = (benar × poin benar) − (salah × pengurang). Perbandingan: cari nilai 1 bagian dulu.',g(){if(Math.random()<.5){const N=r(20,40),b=r(10,N-10),s=r(2,6);return[`Ujian ${N} soal: benar +4, salah −1, kosong 0. Budi benar ${b}, salah ${s}, sisanya kosong. Skor Budi …`,4*b-s,H,`${4*b} − ${s}`]}const P=pick([[2,3],[3,5],[4,7],[3,7]]),k=r(4,15);return[`Kelereng Ana dan Budi berbanding ${P[0]}:${P[1]}, jumlahnya ${(P[0]+P[1])*k}. Selisih kelereng mereka …`,Math.abs(P[0]-P[1])*k,H,`1 bagian = ${k}`]}},

kom:{n:'Pertandingan & Berlipat',bab:'Logika',ic:'⚽',w:2,tip:'n tim saling bertemu 1 kali: n(n−1)÷2. Menggandakan diri tiap tahap: 2 pangkat n.',g(){if(Math.random()<.5){const n=r(5,12);return[`${n} tim sepak bola saling bertemu satu kali. Berapa total pertandingan?`,n*(n-1)/2,H,`${n}×${n-1}÷2`]}const n=r(4,9);return[`Satu bakteri membelah menjadi 2 setiap jam. Berapa bakteri setelah ${n} jam?`,2**n,H,`2 pangkat ${n}`]}}
